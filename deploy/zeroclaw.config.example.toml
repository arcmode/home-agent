# Example ZeroClaw config. The live file is ~/.zeroclaw/config.toml.
# Do not put a Telegram bot token or a heater address in this file.

schema_version = 3

[gateway]
host = "127.0.0.1"
allow_public_bind = false

[tools]
optional = ["send_via"]

[memory]
backend = "none"
embedding_provider = "none"
auto_save = false

[providers.models.ollama.local]
model = "qwen3.5:4b"
uri = "http://127.0.0.1:11434"
num_ctx = 8192
context_window = 8192
num_predict = 768
temperature = 0.1
temperature_override = 0.1
think = true
native_tools = true
timeout_secs = 300

[agents.home]
enabled = true
model_provider = "ollama.local"
transcription_provider = "local_whisper.home"
tts_provider = "piper.home"
risk_profile = "home"
runtime_profile = "home"
mcp_bundles = ["sauna", "audio"]
skill_bundles = ["sauna", "audio"]
channels = ["telegram.home"]

[agents.home.identity]
format = "openclaw"

[agents.home.workspace]
path = "/home/david/code/home-agent"
unrestricted_filesystem = false

[risk_profiles.home]
level = "supervised"
workspace_only = true
require_approval_for_medium_risk = false
block_high_risk_commands = true
sandbox_enabled = true
sandbox_backend = "landlock"
allowed_commands = ["ls", "cat"]
allowed_roots = []
always_ask = ["shell"]
shell_env_passthrough = []
auto_approve = [
    "solara__sauna_status",
    "solara__sauna_preheat",
    "solara__sauna_off",
    "solara__sauna_set_temperature",
    "solara__sauna_set_timer",
    "send_via",
    "audio__audio_replies",
]
allowed_tools = [
    "solara__sauna_status",
    "solara__sauna_preheat",
    "solara__sauna_off",
    "solara__sauna_set_temperature",
    "solara__sauna_set_timer",
    "shell",
    "send_via",
    "audio__audio_replies",
]
excluded_tools = [
    "file_read",
    "file_write",
    "file_edit",
    "glob_search",
    "content_search",
    "http_request",
    "web_search_tool",
    "web_fetch",
    "browser",
    "memory_recall",
    "memory_store",
    "delegate",
    "spawn_subagent",
]

[runtime_profiles.home]
agentic = true
strict_tool_parsing = true
max_tool_iterations = 3
max_history_messages = 8
max_context_tokens = 7000
max_system_prompt_chars = 8000
max_tool_result_chars = 2000
parallel_tools = false
agentic_timeout_secs = 900
delegation_timeout_secs = 30
keep_tool_context_turns = 1
memory_recall_limit = 0

[runtime_profiles.home.thinking]
default_level = "off"
native_thinking = false

[mcp]
enabled = true

[[mcp.servers]]
name = "solara"
transport = "stdio"
command = "/home/david/code/solara/.venv/bin/python"
args = ["/home/david/code/solara/src/sauna_mcp.py"]
tool_timeout_secs = 900

[[mcp.servers]]
name = "audio"
transport = "stdio"
command = "/usr/bin/python3"
args = ["/home/david/code/home-agent/audio/mcp.py"]
tool_timeout_secs = 30

[mcp_bundles.sauna]
servers = ["solara"]

[mcp_bundles.audio]
servers = ["audio"]

[skill_bundles.audio]
directory = "shared/skills"
include = ["audio"]

[skill_bundles.sauna]
directory = "shared/skills"
include = ["sauna"]

[channels.telegram.home]
enabled = false
mention_only = true
passive_group_context = false
approval_timeout_secs = 120

[skills]
allow_scripts = false
open_skills_enabled = false

[transcription]
enabled = true
max_duration_secs = 120

[providers.transcription.local_whisper.home]
uri = "http://127.0.0.1:8178/v1/transcribe"

[tts]
enabled = true

[providers.tts.piper.home]
uri = "http://127.0.0.1:8179/v1/audio/speech"
voice = "en_US-libritts-high"
